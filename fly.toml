# fly.toml — novapilot-backend
app = 'novapilot-backend'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  # Free tier: stop when idle, start on request (cold start ~2s)
  # Production upgrade: set min_machines_running = 1 (no cold start)
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Graceful shutdown — wait 30s for active requests to finish
  # matches the 25s timeout in server.ts shutdown handler
  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# Health check — Fly.io uses this to know if deployment succeeded
# If /health returns non-200, Fly rolls back automatically
[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1